name: Publish verified local AL2 build

on:
  push:
    branches: ['release-upload/**']

permissions:
  contents: write

concurrency:
  group: php81-local-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the local build delivery branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify archive, RPM hashes and local runtime results, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py release-payload/manifest.json
